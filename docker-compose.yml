version: "3.9"

# IDIntel Ghana — Local Development Environment
# Run: make dev-up

x-backend-common: &backend-common
  build:
    context: backend
    target: development
  volumes:
    - ./backend:/app/backend
    - ./backend/shared:/app/shared
  env_file: .env
  environment:
    - ENVIRONMENT=development
    - DEBUG=true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - idintel-net

services:
  # ==================================================
  # API Gateway
  # ==================================================
  api-gateway:
    <<: *backend-common
    build:
      context: backend
      dockerfile: api_gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=api-gateway
      - MTLS_REQUIRED=false  # Disabled in dev
      - IP_ALLOWLIST_ENABLED=false
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "Host(`api.idintel.local`)"

  # ==================================================
  # Identity Service
  # ==================================================
  identity-service:
    <<: *backend-common
    build:
      context: backend
      dockerfile: identity_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=identity-service

  # ==================================================
  # AI Intelligence Service
  # ==================================================
  ai-intelligence-service:
    <<: *backend-common
    build:
      context: backend
      dockerfile: ai_intelligence_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=ai-intelligence-service

  # ==================================================
  # Fraud Detection Service
  # ==================================================
  fraud-detection-service:
    <<: *backend-common
    build:
      context: backend
      dockerfile: fraud_detection_service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=fraud-detection-service
      - MODEL_DIR=/app/ml/models

  # ==================================================
  # Audit Service
  # ==================================================
  audit-service:
    <<: *backend-common
    build:
      context: backend
      dockerfile: audit_service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=audit-service

  # ==================================================
  # Frontend Admin Portal
  # ==================================================
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    networks:
      - idintel-net

  # ==================================================
  # PostgreSQL 16
  # ==================================================
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: idintel_dev
      POSTGRES_USER: idintel
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idintel -d idintel_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idintel-net

  # ==================================================
  # Redis 7
  # ==================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - idintel-net

  # ==================================================
  # Elasticsearch 8
  # ==================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - idintel-net

  # ==================================================
  # Neo4j (Relationship graphs)
  # ==================================================
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/devpassword
    volumes:
      - neo4j-data:/data
    networks:
      - idintel-net

  # ==================================================
  # RabbitMQ (Message queue for Celery)
  # ==================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: idintel
      RABBITMQ_DEFAULT_PASS: devpassword
    networks:
      - idintel-net

  # ==================================================
  # Celery Worker
  # ==================================================
  celery-worker:
    <<: *backend-common
    command: celery -A backend.tasks worker --loglevel=info --concurrency=4
    depends_on:
      - rabbitmq
      - postgres
      - redis
    environment:
      - SERVICE_NAME=celery-worker

  # ==================================================
  # Prometheus + Grafana (Monitoring)
  # ==================================================
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - idintel-net

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: devpassword
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - idintel-net

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
  neo4j-data:
  prometheus-data:
  grafana-data:

networks:
  idintel-net:
    driver: bridge
