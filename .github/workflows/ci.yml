name: CI — Build, Test, Security Scan

on:
  push:
    branches: [main, develop, "claude/**", "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ============================================================
  # Backend: Lint, Type Check, Unit Tests
  # ============================================================
  backend-test:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: idintel_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx anyio

      - name: Install Ruff
        run: pip install ruff==0.15.12

      - name: Lint with Ruff
        run: ruff check backend/ --output-format=github

      - name: Run unit tests
        env:
          ENVIRONMENT: development
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/idintel_test"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          AWS_REGION: "us-east-1"
          AWS_KMS_KEY_ID: "test-kms-key-id"
          AWS_KMS_AUDIT_KEY_ID: "test-audit-kms-key-id"
          NIA_API_BASE_URL: "http://mock-nia:8080"
          NIA_API_CLIENT_CERT_PATH: "/dev/null"
          NIA_API_CLIENT_KEY_PATH: "/dev/null"
          NIA_API_CA_CERT_PATH: "/dev/null"
          ANTHROPIC_API_KEY: "test-key"
          ELASTICSEARCH_URL: "http://localhost:9200"
          ELASTICSEARCH_API_KEY: "test"
          NEO4J_URI: "bolt://localhost:7687"
          NEO4J_USER: "neo4j"
          NEO4J_PASSWORD: "test"
          CELERY_BROKER_URL: "memory://"
          CELERY_RESULT_BACKEND: "cache+memory://"
          AWS_S3_BUCKET_REPORTS: "test-bucket"
          AWS_S3_BUCKET_AUDIT: "test-audit-bucket"
          GIS_API_BASE_URL: "http://mock-gis:8080"
          GIS_API_API_KEY: "test-gis-key"
          MTLS_REQUIRED: "false"
          IP_ALLOWLIST_ENABLED: "false"
          RATE_LIMIT_ENABLED: "false"
          PROMETHEUS_ENABLED: "false"
        run: |
          pytest backend/tests/ -v --tb=short \
            --cov=backend --cov-report=xml --cov-report=term-missing \
            -x --asyncio-mode=auto

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend
        if: always()

  # ============================================================
  # Frontend: Build & Test
  # ============================================================
  frontend-test:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: "https://api.idintel.com.gh"
        run: npm run build

  # ============================================================
  # SAST Security Scanning
  # ============================================================
  sast:
    name: Security — SAST (Semgrep + Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for Bandit)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit — Python security scan
        run: |
          pip install bandit
          bandit -r backend/ -ll -f json -o bandit-report.json || true
          bandit -r backend/ -ll || true

      - name: Semgrep — SAST scan
        run: |
          pip install semgrep
          semgrep scan backend/ \
            --config=p/python \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --severity=WARNING \
            --sarif --output=semgrep-results.sarif || true
        continue-on-error: true

      - name: Upload Bandit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
        if: always()

  # ============================================================
  # Software Composition Analysis
  # ============================================================
  sca:
    name: Security — SCA (Dependency Vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Snyk Python scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=backend/requirements.txt --severity-threshold=high
        continue-on-error: true

      - name: Snyk Node scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=frontend/package.json --severity-threshold=high
        continue-on-error: true

  # ============================================================
  # Container Image Security
  # ============================================================
  container-scan:
    name: Security — Container Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # FIX: build context is backend/ so that cross-service imports resolve;
      #      Dockerfile is specified explicitly with -f
      - name: Build API Gateway image
        run: |
          docker build \
            -f backend/api_gateway/Dockerfile \
            --target production \
            -t idintel-api-gateway:test \
            backend/

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "idintel-api-gateway:test"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()
        continue-on-error: true

  # ============================================================
  # Infrastructure security scan
  # ============================================================
  terraform-security:
    name: Security — Terraform (tfsec + checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: tfsec — Terraform static analysis
        uses: aquasecurity/tfsec-action@v1.0.3
        continue-on-error: true
        with:
          working_directory: infrastructure/terraform
          soft_fail: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov — Terraform policy scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: true
          quiet: true
          download_external_modules: false

  # ============================================================
  # Gate — all required checks must pass
  # ============================================================
  all-checks-pass:
    name: All Checks Passed
    needs: [backend-test, frontend-test, sast, sca]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs passed
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
            echo "Backend tests failed" && exit 1
          fi
          if [[ "${{ needs.frontend-test.result }}" != "success" ]]; then
            echo "Frontend build/tests failed" && exit 1
          fi
          echo "All required checks passed"
