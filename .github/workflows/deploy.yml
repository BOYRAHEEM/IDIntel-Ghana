name: Deploy — Production

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.af-south-1.amazonaws.com
  EKS_CLUSTER_NAME: idintel-production

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        service: [api-gateway, identity-service, ai-intelligence-service, fraud-detection-service, audit-service]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }}
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICE=${{ matrix.service }}
          IMAGE_URI="${ECR_REGISTRY}/idintel-${SERVICE}:${IMAGE_TAG}"

          docker build \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t "${IMAGE_URI}" \
            -f "backend/${SERVICE//-/_}/Dockerfile" \
            backend/

          # Scan before push
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --severity CRITICAL \
            --no-progress \
            "${IMAGE_URI}" || \
            (echo "CRITICAL vulnerabilities found — aborting push" && exit 1)

          docker push "${IMAGE_URI}"
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name idintel-staging --region ${{ env.AWS_REGION }}

      - name: Deploy to staging
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          for SERVICE in api-gateway identity-service ai-intelligence-service fraud-detection-service audit-service; do
            kubectl set image deployment/${SERVICE} \
              ${SERVICE}="${ECR_REGISTRY}/idintel-${SERVICE}:${IMAGE_TAG}" \
              -n idintel
            kubectl rollout status deployment/${SERVICE} -n idintel --timeout=5m
          done

      - name: Run smoke tests against staging
        run: |
          STAGING_URL=${{ secrets.STAGING_API_URL }}
          curl -f "${STAGING_URL}/health" || exit 1
          echo "Staging smoke test passed"

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig (production)
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to production (rolling update)
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          for SERVICE in api-gateway identity-service ai-intelligence-service fraud-detection-service audit-service; do
            echo "Deploying ${SERVICE}..."
            kubectl set image deployment/${SERVICE} \
              ${SERVICE}="${ECR_REGISTRY}/idintel-${SERVICE}:${IMAGE_TAG}" \
              -n idintel
            kubectl rollout status deployment/${SERVICE} -n idintel --timeout=10m
            echo "${SERVICE} deployed successfully"
          done

      - name: Production smoke test
        run: |
          PROD_URL=${{ secrets.PROD_API_URL }}
          curl -f "${PROD_URL}/health" || exit 1
          echo "Production smoke test passed"

      - name: Create deployment record
        if: success()
        run: |
          echo "Production deployment successful"
          echo "Version: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
